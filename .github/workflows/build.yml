name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
      - name: Debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android | grep -i "SHA1" || true
      - name: Build
        run: gradle :android:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: |
          mkdir -p out
          cp android/build/outputs/apk/debug/android-debug.apk out/VinzArena.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VinzArena
          path: out/VinzArena.apk
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: debug.keystore
